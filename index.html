<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MBS. Knowledge Hub Blog</title>
  <meta name="description" content="MBS. Knowledge Hub Blog — notatki techniczne.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Przejdź do treści</a>

  <!-- Pasek widoczny tylko na telefonie -->
  <header class="topbar">
    <a class="topbar__brand" href="#/">
      <img src="assets/img/logo.jpeg" alt="MBS. Knowledge Hub Blog" width="1056" height="612">
    </a>
    <button class="topbar__menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Otwórz menu kategorii">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Kategorie">
      <div class="sidebar__brand">
        <a href="#/">
          <img src="assets/img/logo.jpeg" alt="MBS. Knowledge Hub Blog" width="1056" height="612">
        </a>
      </div>

      <div class="sidebar__filter">
        <label class="visually-hidden" for="tree-filter">Filtruj notatki</label>
        <input class="filter__input" id="tree-filter" type="search" placeholder="Filtruj…" autocomplete="off" spellcheck="false">
      </div>

      <nav class="tree" aria-label="Kategorie i notatki">
        <ul class="tree__list" id="tree" role="tree"></ul>
      </nav>

      <div class="sidebar__footer">
        <a class="sidebar__about" id="about-link" href="#/about">
          About me
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </a>
      </div>
    </aside>

    <div class="scrim" hidden></div>

    <div class="page">
      <main class="article" id="content" tabindex="-1">
        <div class="article__inner">
          <div class="article__category" id="note-category"></div>
          <h1 class="article__title" id="note-title"></h1>
          <p class="article__lead" id="note-lead"></p>

          <div class="article__meta" id="note-meta"></div>

          <div class="prose" id="note-body"></div>

          <nav class="pager" id="note-pager" aria-label="Nawigacja między notatkami"></nav>
        </div>
      </main>

      <footer class="site-footer">
        <span class="site-footer__brand">Knowledge Hub</span>
        <span>Notatki techniczne</span>
      </footer>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
